[package]
name = "cliplink"
version = "0.1.8"
description = "Private local clipboard and file bridge"
authors = ["ClipLink contributors"]
edition = "2021"

[lib]
name = "cliplink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: the embedded app icon is a PNG, and the tray needs to decode it.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

# Transport
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Pairing and payload encryption
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
base64 = "0.22" # also encodes image data URLs sent to the frontend
uuid = { version = "1", features = ["v4"] }

# System clipboard access
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }

# Image encoding/decoding for clipboard image support (PNG screenshots etc.)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Simulate keyboard input for auto-paste after overlay closes
enigo = "0.2"

# Open URLs in the default browser
open = "5"

# Resolve standard user directories (Downloads, Home, etc.)
dirs-next = "2"

# MIME type detection for file transfer
mime_guess = "2"

# Enumerates network interfaces; one "local IP" is not enough to find the PC
local-ip-address = "0.6"

# mDNS advertisement so paired phones can find this PC without a stored IP
mdns-sd = "0.11"
