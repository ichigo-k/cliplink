[package]
name = "cliplink"
version = "0.1.0"
description = "Private local clipboard and file bridge"
authors = ["ClipLink contributors"]
edition = "2021"

[lib]
name = "cliplink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
