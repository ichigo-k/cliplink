name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release runs these same checks before it builds anything.
  workflow_call:

# A newer push to the same branch makes an in-flight run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Works on non-Windows runners only because apps/desktop declares every
      # platform's rollup and esbuild binary. See the note in its package.json.
      - run: npm ci

      - name: Build desktop frontend
        run: npm run build --workspace apps/desktop

      - name: Type-check Android app
        run: npm run typecheck --workspace apps/android

  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Tauri links against the system webview and tray libraries even for a
      # plain `cargo check`, so these are needed before any Rust step.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      # tauri-build reads frontendDist at compile time and fails if it is absent.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Works on non-Windows runners only because apps/desktop declares every
      # platform's rollup and esbuild binary. See the note in its package.json.
      - run: npm ci
      - run: npm run build --workspace apps/desktop

      - name: Formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
