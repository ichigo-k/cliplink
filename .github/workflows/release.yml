name: Release

# Tag a commit to ship it:  git tag v0.1.1 && git push origin v0.1.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Nothing ships unless the same checks that guard main pass first.
  check:
    uses: ./.github/workflows/check.yml

  desktop:
    name: ${{ matrix.label }}
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Linux
            platform: ubuntu-22.04
            target: ''
            args: ''
          - label: Windows
            platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev

      - run: npm ci

      # Signs each artifact and writes latest.json, which is the file the
      # updater in every installed copy polls. Without the signing secrets the
      # build still succeeds but produces updates no client will accept.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ClipLink __VERSION__
          releaseBody: See the assets below to download and install this version.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  android:
    name: Android APK
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # The `secrets` context is not usable in step-level `if`, so fold the check
    # into job-level env vars, which may reference secrets.
    #
    # All four are required together: with the keystore but no password, gradle
    # gets blank credentials and fails deep in the signing task with an error
    # that says nothing about the real cause.
    env:
      HAS_KEYSTORE: >-
        ${{ secrets.ANDROID_KEYSTORE_BASE64 != ''
        && secrets.ANDROID_KEYSTORE_PASSWORD != ''
        && secrets.ANDROID_KEY_ALIAS != ''
        && secrets.ANDROID_KEY_PASSWORD != '' }}
      PARTIAL_KEYSTORE: >-
        ${{ secrets.ANDROID_KEYSTORE_BASE64 != ''
        && (secrets.ANDROID_KEYSTORE_PASSWORD == ''
        || secrets.ANDROID_KEY_ALIAS == ''
        || secrets.ANDROID_KEY_PASSWORD == '') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate the native Android project
        working-directory: apps/android
        run: npx expo prebuild --platform android --no-install

      # `--no-daemon` only stops the Gradle daemon. The Kotlin compile daemon
      # and the AAPT2 daemon are separate long-lived processes that AGP spawns
      # regardless, and both keep a handle on stdout/stderr. The runner won't
      # mark a step complete until every process holding that pipe exits, so
      # without this the job hangs for up to 6 hours after Gradle has already
      # printed BUILD SUCCESSFUL and written the APK to disk.
      - name: Disable daemons that outlive the build and hang the runner
        working-directory: apps/android/android
        run: |
          {
            echo ""
            echo "kotlin.compiler.execution.strategy=in-process"
            echo "android.enableAapt2DaemonMode=false"
          } >> gradle.properties

      # Android refuses to install an update signed with a different key than
      # the installed copy, so the keystore must be identical on every release
      # and therefore comes from a secret. Without it the APK is debug-signed
      # and users have to uninstall before they can update.
      - name: Restore the release keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/android/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          {
            # Expo writes gradle.properties without a trailing newline, so
            # without this the first property is appended onto the end of the
            # last existing line and silently disappears.
            echo ""
            echo "CLIPLINK_UPLOAD_STORE_FILE=release.keystore"
            echo "CLIPLINK_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "CLIPLINK_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "CLIPLINK_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> gradle.properties

          # Fail here rather than 300 lines into a gradle stack trace.
          grep -q '^CLIPLINK_UPLOAD_STORE_FILE=' gradle.properties \
            || { echo "::error::Signing properties did not land in gradle.properties"; exit 1; }

      - name: Point release builds at the keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/android
        run: node scripts/configure-signing.mjs

      # Half-configured is a mistake, not a choice: fail rather than quietly
      # shipping a debug-signed APK that nobody can update from.
      - name: Reject a partial keystore setup
        if: env.PARTIAL_KEYSTORE == 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is set but one of ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is missing. All four are required together."
          exit 1

      - name: Warn about debug signing
        if: env.HAS_KEYSTORE != 'true' && env.PARTIAL_KEYSTORE != 'true'
        run: |
          echo "::warning::No signing keystore configured. This APK is debug-signed and cannot update an existing install."

      - name: Build APK
        working-directory: apps/android/android
        timeout-minutes: 20
        run: ./gradlew assembleRelease --no-daemon

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/android/android/app/build/outputs/apk/release/*.apk

  # Ships JS-only changes to phones already running ClipLink, without asking
  # anyone to reinstall an APK. Native changes still need a new APK.
  android-ota:
    name: Android OTA update
    needs: check
    runs-on: ubuntu-latest
    if: ${{ vars.EAS_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        working-directory: apps/android
        run: eas update --branch production --message "${{ github.ref_name }}"
